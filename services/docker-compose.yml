services:
  redis:
    image: redis:7-alpine
    container_name: oneminutelogs-redis
    environment:
      REDIS_PASSWORD: oneminutelogs
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --requirepass
      - oneminutelogs
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "oneminutelogs", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.7-alpine
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: ch-ui
    depends_on:
      - clickhouse
    ports:
      - "5521:3488/tcp"
    environment:
      VITE_CLICKHOUSE_URL: http://host.docker.internal:8123
      VITE_CLICKHOUSE_USER: default
      VITE_CLICKHOUSE_PASS: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: oneminutelogs-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    command: ["nats-server", "-js", "-m", "8222"]
    restart: unless-stopped

volumes:
  redis_data:
  clickhouse_data:
  nats_data:
